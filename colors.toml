mode = "dark"

# Tiny Is Huge Dark: the same coneflower close-up, dark as the beetle on its
# petals. Beetle-black surfaces, petal-cream text, goldenrod focus from the
# cone, and bright leaf greens for growth.
accent = "#D9A520"
selection = "#2E3A3D"
muted = "#7A7F64"

background = "#121618"
dark_background = "#0D1012"
darker_background = "#080A0B"
lighter_background = "#1F2528"

foreground = "#E7EEDC"
dark_foreground = "#8E9175"
light_foreground = "#C9D3C0"
bright_foreground = "#F5F8EE"

# Window focus runs from the sunlit cone into the leaves behind it.
hyprland_active_border = "#D9A520 #7FA65A 45deg"
hyprland_inactive_border = "#2C3235"

